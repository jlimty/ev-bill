sonar.projectKey=jlimty_ev-bill
sonar.organization=jlimty
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
# cmd/ is outside `-coverpkg=./internal/...`, so Sonar would report it as 0% covered.
# internal/testdb only runs under tests (like _test.go files), so its error branches are not product code.
sonar.coverage.exclusions=cmd/**,internal/testdb/**
sonar.qualitygate.wait=true
