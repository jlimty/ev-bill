{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Stream}}<noscript><meta http-equiv="refresh" content="3"></noscript>
<script src="/static/live.js" defer></script>
{{end}}<title>{{.Title}} · EV billing</title>
<style>
:root { --ink:#1b2430; --muted:#566170; --line:#d8dde3; --bg:#f6f7f9; --card:#fff;
  --peak:#f5b942; --peak-ink:#2b1a00; --off:#0f766e; --off-ink:#fff; --link:#0b5cad; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
header, main, footer { max-width:56rem; margin:0 auto; padding:0 1rem; }
header { padding-top:1.5rem; padding-bottom:.5rem; }
header a { color:var(--ink); font-weight:700; text-decoration:none; }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; }
a { color:var(--link); }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin-bottom:1rem; overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:.5rem .75rem; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--muted); font-size:.85rem; font-weight:600; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
tfoot td { font-weight:700; border-bottom:0; }
.badge { display:inline-block; padding:.1rem .6rem; border-radius:999px; font-size:.85rem; font-weight:600; border:1px solid currentColor; }
.charging { color:#0b5f2a; background:#e3f5e9; }
.stale { color:#8a3b00; background:#fdebd8; }
.completed { color:#3d4756; background:#e9ecf0; }
dl { display:grid; grid-template-columns:max-content 1fr; gap:.25rem 1rem; margin:0; }
dt { color:var(--muted); }
dd { margin:0; }
.bar { display:flex; list-style:none; margin:0; padding:0; gap:2px; }
.seg { min-width:0; }
.seg .block { padding:.5rem; border-radius:4px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.seg .times { font-size:.85rem; line-height:1.3; color:var(--muted); padding-top:.25rem; white-space:normal; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
.seg.peak .block { background:var(--peak); color:var(--peak-ink); }
.seg.offpeak .block { background:var(--off); color:var(--off-ink); }
.legend { display:flex; flex-wrap:wrap; gap:.25rem 1.25rem; list-style:none; margin:.75rem 0 0; padding:0; font-size:.85rem; color:var(--muted); }
.legend li { display:flex; align-items:center; gap:.4rem; }
.swatch { display:inline-block; width:.9rem; height:.9rem; border-radius:3px; }
.swatch.peak { background:var(--peak); }
.swatch.offpeak { background:var(--off); }
.empty { text-align:center; color:var(--muted); padding:2rem 1rem; white-space:normal; }
.source { display:inline-block; padding:0 .4rem; border-radius:4px; font-size:.75rem; font-weight:600; vertical-align:middle; }
.source.mirror { color:#0b4f8a; background:#e2eefb; }
.source.simulated { color:#4b5563; background:#eef0f3; }
.sub { color:var(--muted); font-size:.85rem; }
.tariff { margin:.25rem 0 0; color:var(--muted); font-size:.9rem; }
.notice { color:var(--muted); font-size:.9rem; margin:0 0 1rem; }
.feed { margin:0 0 .75rem; color:var(--muted); font-size:.9rem; }
.feed.warn { color:#8a3b00; font-weight:600; }
footer { color:var(--muted); font-size:.85rem; padding-bottom:2rem; }
footer p { margin:.25rem 0; }
</style>
</head>
<body{{with .Stream}} data-stream="{{.}}"{{end}}>
<header><a href="/">EV billing</a><p class="tariff">{{.Tariff}}</p></header>
<main>
{{template "content" .}}
</main>
<footer>
<p>Times are shown in {{.TZ}}.{{if .Stream}} This page updates live.{{end}}</p>
<p>Charger data: LTA DataMall EV Charging Points.</p>
</footer>
</body>
</html>
{{end}}
