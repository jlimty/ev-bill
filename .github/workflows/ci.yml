name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The job ids (lint, test, sonar, vuln, secrets) are the check names that branch
# protection requires. Do not rename them or add a `name:` to a job.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make fmt-check
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evbilling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/evbilling_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make test test-tz
      # The sonar job downloads this artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  sonar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives Sonar the history it uses to find new code.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make vuln

  secrets:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 downloads the whole history, which gitleaks scans.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The tarball goes in RUNNER_TEMP, outside the checkout, so the scan of
      # the checkout does not scan the download. The sha256 is the digest
      # GitHub publishes for this release asset.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - run: make secrets
