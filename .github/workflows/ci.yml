name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The job ids (lint, test, sonar, vuln, secrets) are the check names that branch
# protection requires. Do not rename them or add a `name:` to a job.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make fmt-check
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evbilling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/evbilling_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make test test-tz
      # The sonar job downloads this artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  sonar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives Sonar the history it uses to find new code.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      # Third-party actions are pinned to a full commit SHA (Sonar rule
      # githubactions:S7637). Dependabot still updates the SHA and the comment.
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make vuln

  secrets:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 downloads the whole history, which gitleaks scans.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The tarball goes in RUNNER_TEMP, outside the checkout, so the scan of
      # the checkout does not scan the download. The sha256 is the digest
      # GitHub publishes for this release asset.
      - name: Install gitleaks 8.30.1
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - run: make secrets

  # A report, not a gate: the report step always exits 0, because the deploy
  # blocks on any failed check. Only a setup failure (checkout, setup-go), a
  # cancellation or the timeout below can fail this job. It is not in the list
  # of required checks.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Mutation report
        run: |
          # Run the mutation tests and keep the output. `|| status=$?` stops the
          # shell's exit-on-error from ending the step before we record it.
          status=0
          make mutation > "$RUNNER_TEMP/mutation.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/mutation.txt"

          # "Killed: 43, Lived: 3, ..." -> the number of mutants actually tested.
          tested=$(sed -n 's/^Killed: \([0-9]*\), Lived: \([0-9]*\),.*/\1 \2/p' "$RUNNER_TEMP/mutation.txt" | awk '{print $1 + $2}')

          {
            echo "## Mutation report (internal/billing)"
            echo
            if grep -q '^mutation: skipped' "$RUNNER_TEMP/mutation.txt"; then
              # The Makefile found no internal/billing directory.
              echo "Skipped: $(cat "$RUNNER_TEMP/mutation.txt")"
            elif [ "$status" -eq 0 ] && [ "${tested:-0}" -gt 0 ] && grep -q 'Test efficacy' "$RUNNER_TEMP/mutation.txt"; then
              echo '```'
              grep -E '^(Killed|Timed out|Test efficacy|Mutator coverage)' "$RUNNER_TEMP/mutation.txt"
              echo '```'
            else
              # Non-zero exit, no score printed, or no mutant killed or lived
              # (for example every mutant timed out, which prints 0.00%).
              # Never report these as a score.
              echo "**The mutation run failed (exit code $status; mutants tested: ${tested:-none}), so there is no score.**"
              echo
              echo 'Last lines of output:'
              echo '```'
              tail -n 20 "$RUNNER_TEMP/mutation.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Report only: never fail the job.
          exit 0
