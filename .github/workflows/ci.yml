name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The job ids (lint, test, sonar, vuln, secrets) are the check names that branch
# protection requires. Do not rename them or add a `name:` to a job.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make fmt-check
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evbilling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/evbilling_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make test test-tz
      # The sonar job downloads this artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # A browser test of the status pages. Report-only for now, like mutation: the
  # install and test steps use continue-on-error, so this job always concludes
  # as success and cannot hold back the deploy (autoDeployTrigger: checksPass
  # waits on every check). A failure is visible in the step summary and in a
  # ::warning:: annotation. Promote it to a required, blocking check once it
  # has been stable.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evbilling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/evbilling_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The module's own CLI, so the driver matches the version in go.mod.
      - id: install
        continue-on-error: true
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium
      - id: e2e
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: go test -tags e2e -count=1 ./e2e/...
      - name: Report
        if: always()
        run: |
          {
            echo "## Browser test (e2e)"
            if [ "${{ steps.install.outcome }}" != "success" ]; then
              echo "**FAIL: Playwright install did not succeed (${{ steps.install.outcome }}).**"
              echo "::warning::e2e install step failed"
            elif [ "${{ steps.e2e.outcome }}" = "success" ]; then
              echo "PASS"
            else
              echo "**FAIL: the e2e test step failed (${{ steps.e2e.outcome }}).**"
              echo "::warning::e2e test step failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sonar:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives Sonar the history it uses to find new code.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      # Third-party actions are pinned to a full commit SHA (Sonar rule
      # githubactions:S7637). Dependabot still updates the SHA and the comment.
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make vuln

  secrets:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 downloads the whole history, which gitleaks scans.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The tarball goes in RUNNER_TEMP, outside the checkout, so the scan of
      # the checkout does not scan the download. The sha256 is the digest
      # GitHub publishes for this release asset. --retry retries a timeout or an
      # HTTP 408, 429, 500, 502, 503 or 504, waiting 1 s and doubling each time
      # (1+2+...+64 s), and --retry-max-time stops new retries after 150 s.
      # GitHub's release download once returned 504s for minutes, which failed
      # this job on main and held back the deploy.
      - name: Install gitleaks 8.30.1
        run: |
          curl --proto '=https' --tlsv1.2 --retry 7 --retry-max-time 150 -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - run: make secrets

  # A CycloneDX SBOM of the Go module (workflow artifact `sbom`) and a Trivy
  # scan of go.mod/go.sum for known vulnerabilities and licences, written to
  # the step summary. Report-only, like e2e and mutation: every step that can
  # fail uses continue-on-error and the Report step always exits 0, so this job
  # concludes as success and cannot hold back the deploy (autoDeployTrigger:
  # checksPass waits on every check). Only a setup failure (checkout,
  # setup-go), a cancellation or the timeout below can fail it. It is not in
  # the list of required checks. govulncheck (the vuln job) stays the blocking
  # vulnerability gate: it reports only vulnerabilities the code can reach,
  # while Trivy matches module versions.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY_NO_PROGRESS: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # A release binary rather than a tool directive: Trivy as a Go tool would
      # add its large dependency tree to go.mod. Same pattern as gitleaks: the
      # tarball goes in RUNNER_TEMP, the sha256 is the digest GitHub publishes
      # for this release asset (it matches trivy_0.76.1_checksums.txt), and
      # --retry rides out a transient error. The step timeout leaves room for
      # the 150 s of retries.
      - id: install
        name: Install Trivy 0.76.1
        continue-on-error: true
        timeout-minutes: 5
        run: |
          curl --proto '=https' --tlsv1.2 --retry 7 --retry-max-time 150 -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo install "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          trivy --version
      # Trivy reads each module's licence from the module cache.
      - id: download
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: go mod download
      # The SBOM needs no vulnerability database, so a database download
      # failure in the scan below does not cost the SBOM.
      - id: sbom
        name: Generate SBOM
        if: steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: trivy fs --format cyclonedx --output "$RUNNER_TEMP/sbom.cdx.json" .
      - id: upload
        if: steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
      # --exit-code stays at its default of 0, so findings do not fail this
      # step; it fails only when Trivy itself fails (database download, crash).
      - id: scan
        name: Trivy scan
        if: steps.install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: trivy fs --scanners vuln,license --format json --output "$RUNNER_TEMP/trivy.json" .
      - name: Report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          SBOM: ${{ steps.sbom.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          SCAN: ${{ steps.scan.outcome }}
        run: |
          # Workflow commands such as ::warning:: go to stdout; only the
          # report goes to the step summary.
          summary() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
          summary "## SBOM and Trivy dependency scan (report-only)" ""

          if [ "$INSTALL" != "success" ]; then
            summary "**FAIL: the Trivy install did not succeed ($INSTALL), so there is no SBOM and no scan.**"
            echo "::warning::sbom: Trivy install failed"
            exit 0
          fi

          if [ "$SBOM" = "success" ] && [ "$UPLOAD" = "success" ]; then
            components=$(jq '.components | length' "$RUNNER_TEMP/sbom.cdx.json") || components="an unknown number of"
            summary "SBOM: CycloneDX, $components components, in this run's artifact \`sbom\`." ""
          else
            summary "**FAIL: no SBOM artifact (generate: $SBOM, upload: $UPLOAD).**" ""
            echo "::warning::sbom: no SBOM artifact"
          fi

          if [ "$DOWNLOAD" != "success" ]; then
            summary "Note: \`go mod download\` did not succeed ($DOWNLOAD), so licences may be missing." ""
          fi

          if [ "$SCAN" = "success" ] && scripts/trivy-summary.sh "$RUNNER_TEMP/trivy.json" > "$RUNNER_TEMP/trivy.md"; then
            cat "$RUNNER_TEMP/trivy.md" >> "$GITHUB_STEP_SUMMARY"
          else
            summary "**FAIL: the Trivy scan did not succeed (scan: $SCAN), so there are no findings to report.**"
            echo "::warning::sbom: Trivy scan failed"
          fi

          # Report only: never fail the job.
          exit 0

  # A report, not a gate: the report step always exits 0, because the deploy
  # blocks on any failed check. Only a setup failure (checkout, setup-go), a
  # cancellation or the timeout below can fail this job. It is not in the list
  # of required checks.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Mutation report
        run: |
          # Run the mutation tests and keep the output. `|| status=$?` stops the
          # shell's exit-on-error from ending the step before we record it.
          status=0
          make mutation > "$RUNNER_TEMP/mutation.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/mutation.txt"

          # "Killed: 43, Lived: 3, ..." -> the number of mutants actually tested.
          tested=$(sed -n 's/^Killed: \([0-9]*\), Lived: \([0-9]*\),.*/\1 \2/p' "$RUNNER_TEMP/mutation.txt" | awk '{print $1 + $2}')

          {
            echo "## Mutation report (internal/billing)"
            echo
            if grep -q '^mutation: skipped' "$RUNNER_TEMP/mutation.txt"; then
              # The Makefile found no internal/billing directory.
              echo "Skipped: $(cat "$RUNNER_TEMP/mutation.txt")"
            elif [ "$status" -eq 0 ] && [ "${tested:-0}" -gt 0 ] && grep -q 'Test efficacy' "$RUNNER_TEMP/mutation.txt"; then
              echo '```'
              grep -E '^(Killed|Timed out|Test efficacy|Mutator coverage)' "$RUNNER_TEMP/mutation.txt"
              echo '```'
            else
              # Non-zero exit, no score printed, or no mutant killed or lived
              # (for example every mutant timed out, which prints 0.00%).
              # Never report these as a score.
              echo "**The mutation run failed (exit code $status; mutants tested: ${tested:-none}), so there is no score.**"
              echo
              echo 'Last lines of output:'
              echo '```'
              tail -n 20 "$RUNNER_TEMP/mutation.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Report only: never fail the job.
          exit 0
